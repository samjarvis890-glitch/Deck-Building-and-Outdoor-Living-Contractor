<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52" fill="none">
  <!-- Architectural Mark: Pergola Rafters + Timber Deck Planks + Evergreen Leaf -->
  <g transform="translate(4, 4)">
    <!-- Base / Deck Planks -->
    <rect x="2" y="36" width="38" height="2.5" rx="1.25" fill="#A8754E" />
    <rect x="6" y="40.5" width="30" height="2" rx="1" fill="#82977B" opacity="0.8" />
    
    <!-- Pergola Posts & Support Structure -->
    <rect x="6" y="14" width="3" height="22" rx="1" fill="#254B3B" />
    <rect x="33" y="14" width="3" height="22" rx="1" fill="#254B3B" />
    
    <!-- Pergola Horizontal Beam -->
    <rect x="2" y="12" width="38" height="3" rx="1.5" fill="#254B3B" />
    <!-- Pergola Top Rafter Tails -->
    <rect x="5" y="6" width="2.5" height="7" rx="1.2" fill="#254B3B" />
    <rect x="13" y="6" width="2.5" height="7" rx="1.2" fill="#254B3B" />
    <rect x="21" y="6" width="2.5" height="7" rx="1.2" fill="#254B3B" />
    <rect x="29" y="6" width="2.5" height="7" rx="1.2" fill="#254B3B" />
    <rect x="36.5" y="7" width="4.5" height="2" rx="1" fill="#A8754E" />

    <!-- Organic Leaf Motif interlaced with Architecture -->
    <path d="M12 34 C12 24, 21 17, 28 17 C28 25, 23 33, 12 34 Z" fill="#254B3B" opacity="0.9" />
    <path d="M12 34 C16 26, 21 21, 28 17" stroke="#E9DFC9" stroke-width="1.2" stroke-linecap="round" />
    <path d="M18 29 C21 27, 24 23, 26 21" stroke="#E9DFC9" stroke-width="0.9" stroke-linecap="round" />
    
    <!-- Accent dot / sun connection -->
    <circle cx="21" cy="4" r="1.5" fill="#A8754E" />
  </g>

  <!-- Typography -->
  <text x="56" y="25" font-family="'DM Serif Display', 'Playfair Display', Georgia, serif" font-size="20" font-weight="600" letter-spacing="0.08em" fill="#18382C">EVERGREEN</text>
  <text x="56.5" y="38" font-family="'Inter', 'Manrope', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.28em" fill="#70776F">OUTDOOR LIVING</text>
</svg>
